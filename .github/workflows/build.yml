name: build

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ryofiles-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git base-devel cmake ninja ccache dbus exiv2 ffmpeg glib2 libarchive poppler-qt6 python-gobject qt6-base qt6-declarative qt6-imageformats qt6-multimedia qt6-multimedia-ffmpeg ttf-dejavu xdg-desktop-portal
      - uses: actions/checkout@v4
      - name: Validate target-machine harness
        shell: bash
        run: |
          bash -n tools/validation/target-machine.sh
          bash tools/validation/target-machine.sh self-test
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ryofiles-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ryofiles-ccache-${{ runner.os }}-
      - name: Configure compiler cache
        run: |
          ccache --max-size=500M
          ccache --zero-stats
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRYOFILES_BUILD_TESTS=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 2
      - name: Application QML startup smoke
        shell: bash
        run: dbus-run-session -- bash tests/ApplicationStartupSmoke.sh "$PWD/build/ryofiles"
      - name: FileChooser D-Bus smoke
        shell: bash
        run: dbus-run-session -- bash tests/FileChooserPortalSmoke.sh "$PWD/build/ryofiles"
      - name: FileChooser public broker smoke
        shell: bash
        run: bash tests/FileChooserBrokerSmoke.sh "$PWD/build/ryofiles"
      - name: FileChooser public broker request matrix
        shell: bash
        run: bash tests/FileChooserBrokerMatrix.sh "$PWD/build/ryofiles"
      - name: Configure portal routing helper
        run: >-
          cmake -S tools/portalctl -B build-portalctl -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DRYOFILES_PORTALCTL_BUILD_TESTS=ON
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build portal routing helper
        run: cmake --build build-portalctl --parallel 2
      - name: Test portal routing helper
        run: ctest --test-dir build-portalctl --output-on-failure
      - name: Configure preview foundation
        run: >-
          cmake -S tools/preview -B build-preview -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DRYOFILES_PREVIEW_BUILD_TESTS=ON
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build preview foundation
        run: cmake --build build-preview --parallel 2
      - name: Test preview foundation
        run: ctest --test-dir build-preview --output-on-failure
      - name: Smoke-test staged install
        shell: bash
        run: |
          set -euo pipefail
          rm -rf stage
          DESTDIR="$PWD/stage" cmake --install build --prefix /usr
          DESTDIR="$PWD/stage" cmake --install build-portalctl --prefix /usr
          DESTDIR="$PWD/stage" cmake --install build-preview --prefix /usr

          test -x stage/usr/bin/ryofiles
          test -x stage/usr/bin/ryofiles-portalctl
          test -x stage/usr/bin/ryofiles-preview-helper
          test -f stage/usr/share/applications/ryofiles.desktop
          test ! -e stage/etc

          mapfile -t installed < <(find stage -type f -printf '%P\n' | sort)
          expected=(
            'usr/bin/ryofiles'
            'usr/bin/ryofiles-portalctl'
            'usr/bin/ryofiles-preview-helper'
            'usr/share/applications/ryofiles.desktop'
          )

          if [[ "${installed[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected staged install layout:\n' >&2
            printf '  %s\n' "${installed[@]}" >&2
            exit 1
          fi
      - name: Compiler cache stats
        if: always()
        run: ccache --show-stats
