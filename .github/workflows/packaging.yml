name: packaging

on:
  push:
    branches:
      - main
    paths:
      - 'CMakeLists.txt'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'assets/*.desktop'
      - 'assets/*.metainfo.xml'
      - 'assets/portal/**'
      - 'src/**'
      - 'qml/**'
      - 'tests/PortalRoutingManagerTest.cpp'
      - 'tools/portalctl/**'
      - 'packaging/**'
      - '.github/workflows/packaging.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'assets/*.desktop'
      - 'assets/*.metainfo.xml'
      - 'assets/portal/**'
      - 'src/**'
      - 'qml/**'
      - 'tests/PortalRoutingManagerTest.cpp'
      - 'tools/portalctl/**'
      - 'packaging/**'
      - '.github/workflows/packaging.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: packaging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install validation tools
        run: pacman -Syu --noconfirm --needed git appstream desktop-file-utils

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate desktop entry
        run: desktop-file-validate assets/ryofiles.desktop

      - name: Validate AppStream metadata
        run: appstreamcli validate --no-net assets/io.github.ashmitvoid.Ryofiles.metainfo.xml

      - name: Validate release version metadata
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(sed -n 's/^project(ryofiles VERSION \([^ ]*\) LANGUAGES.*/\1/p' CMakeLists.txt)"
          portalctl_version="$(sed -n 's/^project(ryofiles-portalctl VERSION \([^ ]*\) LANGUAGES.*/\1/p' tools/portalctl/CMakeLists.txt)"
          release_pkgver="$(sed -n 's/^pkgver=\(.*\)$/\1/p' packaging/arch/PKGBUILD.release)"

          test -n "$project_version"
          test "$portalctl_version" = "$project_version"
          test "$release_pkgver" = "$project_version"
          grep -Fq "<release version=\"$project_version\"" \
            assets/io.github.ashmitvoid.Ryofiles.metainfo.xml
          grep -Fq "## $project_version " CHANGELOG.md

      - name: Validate neutral portal registration
        shell: bash
        run: |
          set -euo pipefail
          portal='assets/portal/ryofiles.portal'
          service='assets/portal/org.freedesktop.impl.portal.desktop.ryofiles.service'

          grep -Fxq '[portal]' "$portal"
          grep -Fxq 'DBusName=org.freedesktop.impl.portal.desktop.ryofiles' "$portal"
          grep -Fxq 'Interfaces=org.freedesktop.impl.portal.FileChooser;' "$portal"
          if grep -Eq '^UseIn=' "$portal"; then
            echo 'Registration must not select Ryofiles through legacy UseIn routing.' >&2
            exit 1
          fi

          grep -Fxq '[D-BUS Service]' "$service"
          grep -Fxq 'Name=org.freedesktop.impl.portal.desktop.ryofiles' "$service"
          grep -Fxq 'Exec=/usr/bin/ryofiles --filechooser-portal' "$service"

      - name: Validate PKGBUILD shell syntax
        run: |
          bash -n packaging/arch/PKGBUILD
          bash -n packaging/arch/PKGBUILD.release

      - name: Guard reversible integration
        shell: bash
        run: |
          set -euo pipefail
          if grep -En '(xdg-mime[[:space:]]+default|xdg-settings|portals\.conf|xdg-desktop-portal.*\.conf)' \
              packaging/arch/PKGBUILD packaging/arch/PKGBUILD.release; then
            echo 'Packaging must not change file-manager or portal defaults during installation.' >&2
            exit 1
          fi

          if find assets/portal -maxdepth 1 -type f -name '*.conf' -print -quit | grep -q .; then
            echo 'Registration assets must not include portal routing configuration.' >&2
            exit 1
          fi

  arch-package:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    env:
      PACKAGE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Install package build dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          base-devel cmake git ninja glib2 gvfs libarchive qt6-base qt6-declarative

      - name: Checkout exact package source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prepare exact-SHA package recipe
        shell: bash
        run: |
          set -euo pipefail
          package_work="$GITHUB_WORKSPACE/.ci-arch-package"
          rm -rf "$package_work"
          mkdir -p "$package_work"
          cp packaging/arch/PKGBUILD "$package_work/PKGBUILD"

          unpinned="source=('git+https://github.com/ashmitvoid/Ryofiles.git')"
          pinned="source=('git+https://github.com/ashmitvoid/Ryofiles.git#commit=$PACKAGE_SOURCE_SHA')"

          grep -Fxq "$unpinned" "$package_work/PKGBUILD" || {
            echo 'PKGBUILD source declaration changed; update the CI pinning guard deliberately.' >&2
            exit 1
          }

          sed -i "s|^source=('git+https://github.com/ashmitvoid/Ryofiles.git')$|$pinned|" "$package_work/PKGBUILD"
          grep -Fxq "$pinned" "$package_work/PKGBUILD"

      - name: Build package as unprivileged user
        shell: bash
        run: |
          set -euo pipefail
          package_work="$GITHUB_WORKSPACE/.ci-arch-package"
          useradd --create-home builder
          chown -R builder:builder "$package_work"
          su builder -c "cd '$package_work' && makepkg --noconfirm --cleanbuild"

      - name: Verify package source is exact CI head
        shell: bash
        run: |
          set -euo pipefail
          package_work="$GITHUB_WORKSPACE/.ci-arch-package"
          packaged_sha="$(su builder -c "git -C '$package_work/src/Ryofiles' rev-parse HEAD")"
          test "$packaged_sha" = "$PACKAGE_SOURCE_SHA" || {
            echo "PKGBUILD built $packaged_sha instead of expected head $PACKAGE_SOURCE_SHA" >&2
            exit 1
          }

      - name: Inspect package payload
        shell: bash
        run: |
          set -euo pipefail
          package_work="$GITHUB_WORKSPACE/.ci-arch-package"
          package_path="$(find "$package_work" -maxdepth 1 -type f -name 'ryofiles-git-[0-9]*-x86_64.pkg.tar.zst' -print -quit)"
          test -n "$package_path"
          bsdtar -tf "$package_path" > /tmp/ryofiles-package-files.txt

          for required in \
            usr/bin/ryofiles \
            usr/bin/ryofiles-portalctl \
            usr/share/applications/ryofiles.desktop \
            usr/share/metainfo/io.github.ashmitvoid.Ryofiles.metainfo.xml \
            usr/share/xdg-desktop-portal/portals/ryofiles.portal \
            usr/share/dbus-1/services/org.freedesktop.impl.portal.desktop.ryofiles.service \
            usr/share/licenses/ryofiles-git/LICENSE \
            usr/share/licenses/ryofiles-git/THIRD_PARTY_NOTICES.md; do
            grep -Fxq "$required" /tmp/ryofiles-package-files.txt || {
              echo "Missing package payload: $required" >&2
              exit 1
            }
          done

          if grep -Eq '^etc/' /tmp/ryofiles-package-files.txt; then
            echo 'Package must not write system configuration.' >&2
            cat /tmp/ryofiles-package-files.txt >&2
            exit 1
          fi

          while IFS= read -r portal_file; do
            if [[ "$portal_file" != 'usr/share/xdg-desktop-portal/portals/ryofiles.portal' ]]; then
              echo "Unexpected portal routing/registration payload: $portal_file" >&2
              exit 1
            fi
          done < <(grep -E '^usr/share/xdg-desktop-portal/.*\.(portal|conf)$' /tmp/ryofiles-package-files.txt || true)

      - name: Install package and verify runtime linkage
        shell: bash
        run: |
          set -euo pipefail
          package_work="$GITHUB_WORKSPACE/.ci-arch-package"
          package_path="$(find "$package_work" -maxdepth 1 -type f -name 'ryofiles-git-[0-9]*-x86_64.pkg.tar.zst' -print -quit)"
          pacman -U --noconfirm "$package_path"

          test -x /usr/bin/ryofiles
          test -x /usr/bin/ryofiles-portalctl
          test -f /usr/share/applications/ryofiles.desktop
          test -f /usr/share/metainfo/io.github.ashmitvoid.Ryofiles.metainfo.xml
          test -f /usr/share/xdg-desktop-portal/portals/ryofiles.portal
          test -f /usr/share/dbus-1/services/org.freedesktop.impl.portal.desktop.ryofiles.service
          test -f /usr/share/licenses/ryofiles-git/LICENSE
          test -f /usr/share/licenses/ryofiles-git/THIRD_PARTY_NOTICES.md
          grep -Fxq 'Exec=/usr/bin/ryofiles --filechooser-portal' \
            /usr/share/dbus-1/services/org.freedesktop.impl.portal.desktop.ryofiles.service

          expected_version="$(sed -n 's/^project(ryofiles VERSION \([^ ]*\) LANGUAGES.*/\1/p' CMakeLists.txt)"
          /usr/bin/ryofiles-portalctl --version | grep -Fq "$expected_version"

          ldd /usr/bin/ryofiles | tee /tmp/ryofiles-ldd.txt
          ldd /usr/bin/ryofiles-portalctl | tee /tmp/ryofiles-portalctl-ldd.txt
          if grep -Fq 'not found' /tmp/ryofiles-ldd.txt \
            || grep -Fq 'not found' /tmp/ryofiles-portalctl-ldd.txt; then
            echo 'Installed package has unresolved runtime libraries.' >&2
            exit 1
          fi

          grep -Eq 'libarchive\.so' /tmp/ryofiles-ldd.txt || {
            echo 'Installed Ryofiles binary is not linked against libarchive.' >&2
            exit 1
          }

  version-transition:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.versions.outputs.changed }}
      base_version: ${{ steps.versions.outputs.base_version }}
      head_version: ${{ steps.versions.outputs.head_version }}
    steps:
      - name: Checkout exact PR head with history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - id: versions
        name: Detect project version transition
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          head_version="$(sed -n 's/^project(ryofiles VERSION \([^ ]*\) LANGUAGES.*/\1/p' CMakeLists.txt)"
          base_version="$(git show "$BASE_SHA:CMakeLists.txt" | sed -n 's/^project(ryofiles VERSION \([^ ]*\) LANGUAGES.*/\1/p')"
          test -n "$head_version"
          test -n "$base_version"
          echo "head_version=$head_version" >> "$GITHUB_OUTPUT"
          echo "base_version=$base_version" >> "$GITHUB_OUTPUT"
          if [[ "$head_version" != "$base_version" ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

  release-migration:
    needs:
      - metadata
      - version-transition
    if: needs.version-transition.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    container: archlinux:latest
    env:
      BASE_SOURCE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      RELEASE_VERSION: ${{ needs.version-transition.outputs.head_version }}
    steps:
      - name: Install migration-test dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          base-devel cmake git ninja glib2 gvfs libarchive qt6-base qt6-declarative

      - name: Checkout exact PR head with base history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Prepare base development package
        shell: bash
        run: |
          set -euo pipefail
          base_work="$GITHUB_WORKSPACE/.ci-base-package"
          rm -rf "$base_work"
          mkdir -p "$base_work"
          git show "$BASE_SOURCE_SHA:packaging/arch/PKGBUILD" > "$base_work/PKGBUILD"

          unpinned="source=('git+https://github.com/ashmitvoid/Ryofiles.git')"
          pinned="source=('git+https://github.com/ashmitvoid/Ryofiles.git#commit=$BASE_SOURCE_SHA')"
          grep -Fxq "$unpinned" "$base_work/PKGBUILD"
          sed -i "s|^source=('git+https://github.com/ashmitvoid/Ryofiles.git')$|$pinned|" "$base_work/PKGBUILD"

      - name: Prepare stable release package from exact head
        shell: bash
        run: |
          set -euo pipefail
          release_work="$GITHUB_WORKSPACE/.ci-release-package"
          rm -rf "$release_work"
          mkdir -p "$release_work"
          cp packaging/arch/PKGBUILD.release "$release_work/PKGBUILD"

          grep -Fq '#tag=v${pkgver}' "$release_work/PKGBUILD"
          sed -i "s|#tag=v\${pkgver}|#commit=$HEAD_SOURCE_SHA|" "$release_work/PKGBUILD"
          grep -Fq "#commit=$HEAD_SOURCE_SHA" "$release_work/PKGBUILD"

      - name: Build base and release packages as unprivileged user
        shell: bash
        run: |
          set -euo pipefail
          useradd --create-home migrator
          chown -R migrator:migrator \
            "$GITHUB_WORKSPACE/.ci-base-package" \
            "$GITHUB_WORKSPACE/.ci-release-package"
          su migrator -c "cd '$GITHUB_WORKSPACE/.ci-base-package' && makepkg --noconfirm --cleanbuild"
          su migrator -c "cd '$GITHUB_WORKSPACE/.ci-release-package' && makepkg --noconfirm --cleanbuild"

      - name: Verify stable package source and payload
        shell: bash
        run: |
          set -euo pipefail
          release_work="$GITHUB_WORKSPACE/.ci-release-package"
          packaged_sha="$(su migrator -c "git -C '$release_work/src/Ryofiles' rev-parse HEAD")"
          test "$packaged_sha" = "$HEAD_SOURCE_SHA"

          release_pkg="$(find "$release_work" -maxdepth 1 -type f -name "ryofiles-$RELEASE_VERSION-*-x86_64.pkg.tar.zst" -print -quit)"
          test -n "$release_pkg"
          bsdtar -tf "$release_pkg" > /tmp/ryofiles-release-files.txt
          grep -Fxq 'usr/bin/ryofiles' /tmp/ryofiles-release-files.txt
          grep -Fxq 'usr/bin/ryofiles-portalctl' /tmp/ryofiles-release-files.txt
          grep -Fxq 'usr/share/licenses/ryofiles/LICENSE' /tmp/ryofiles-release-files.txt
          grep -Fxq 'usr/share/licenses/ryofiles/THIRD_PARTY_NOTICES.md' /tmp/ryofiles-release-files.txt
          if grep -Eq '^etc/' /tmp/ryofiles-release-files.txt; then
            echo 'Stable package must not write system configuration.' >&2
            exit 1
          fi

      - name: Migrate development package to stable V1
        shell: bash
        run: |
          set -euo pipefail
          base_pkg="$(find "$GITHUB_WORKSPACE/.ci-base-package" -maxdepth 1 -type f -name 'ryofiles-git-*-x86_64.pkg.tar.zst' -print -quit)"
          release_pkg="$(find "$GITHUB_WORKSPACE/.ci-release-package" -maxdepth 1 -type f -name "ryofiles-$RELEASE_VERSION-*-x86_64.pkg.tar.zst" -print -quit)"
          test -n "$base_pkg"
          test -n "$release_pkg"

          pacman -U --noconfirm "$base_pkg"
          pacman -Q ryofiles-git
          test -x /usr/bin/ryofiles

          pacman -R --noconfirm ryofiles-git
          pacman -U --noconfirm "$release_pkg"
          pacman -Q ryofiles
          if pacman -Q ryofiles-git >/dev/null 2>&1; then
            echo 'Development package remained installed after stable migration.' >&2
            exit 1
          fi

          /usr/bin/ryofiles-portalctl --version | grep -Fq "$RELEASE_VERSION"

      - name: Exercise installed reversible FileChooser routing
        shell: bash
        run: |
          set -euo pipefail
          route_root="$(mktemp -d)"
          config_home="$route_root/config"
          state_home="$route_root/state"
          config_dir="$config_home/xdg-desktop-portal"
          config="$config_dir/hyprland-portals.conf"
          original="$route_root/original.conf"
          mkdir -p "$config_dir" "$state_home"

          cat > "$config" <<'EOF'
          [preferred]
          default=gtk
          org.freedesktop.impl.portal.FileChooser=gtk
          org.freedesktop.impl.portal.ScreenCast=hyprland
          org.freedesktop.impl.portal.Screenshot=hyprland
          EOF
          cp "$config" "$original"

          XDG_CONFIG_HOME="$config_home" XDG_STATE_HOME="$state_home" \
            /usr/bin/ryofiles-portalctl status | grep -Fxq 'enabled=no'
          XDG_CONFIG_HOME="$config_home" XDG_STATE_HOME="$state_home" \
            /usr/bin/ryofiles-portalctl enable
          XDG_CONFIG_HOME="$config_home" XDG_STATE_HOME="$state_home" \
            /usr/bin/ryofiles-portalctl status | grep -Fxq 'managed=yes'
          grep -Fxq 'org.freedesktop.impl.portal.FileChooser=ryofiles;gtk' "$config"

          XDG_CONFIG_HOME="$config_home" XDG_STATE_HOME="$state_home" \
            /usr/bin/ryofiles-portalctl disable
          cmp "$original" "$config"
          test ! -e "$state_home/ryofiles/portal-routing.json"

          printf '%s\n' "$route_root" > /tmp/ryofiles-route-root

      - name: Uninstall stable package cleanly
        shell: bash
        run: |
          set -euo pipefail
          route_root="$(cat /tmp/ryofiles-route-root)"
          pacman -Rns --noconfirm ryofiles

          test ! -e /usr/bin/ryofiles
          test ! -e /usr/bin/ryofiles-portalctl
          test ! -e /usr/share/applications/ryofiles.desktop
          test ! -e /usr/share/metainfo/io.github.ashmitvoid.Ryofiles.metainfo.xml
          test ! -e /usr/share/xdg-desktop-portal/portals/ryofiles.portal
          test ! -e /usr/share/dbus-1/services/org.freedesktop.impl.portal.desktop.ryofiles.service
          test ! -e /usr/share/licenses/ryofiles
          cmp "$route_root/original.conf" \
            "$route_root/config/xdg-desktop-portal/hyprland-portals.conf"
          test ! -e "$route_root/state/ryofiles/portal-routing.json"
