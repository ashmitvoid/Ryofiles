name: packaging

on:
  push:
    paths:
      - 'CMakeLists.txt'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'assets/*.desktop'
      - 'assets/*.metainfo.xml'
      - 'packaging/**'
      - '.github/workflows/packaging.yml'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'assets/*.desktop'
      - 'assets/*.metainfo.xml'
      - 'packaging/**'
      - '.github/workflows/packaging.yml'
  workflow_dispatch:

concurrency:
  group: packaging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install validation tools
        run: pacman -Syu --noconfirm --needed git appstream desktop-file-utils

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate desktop entry
        run: desktop-file-validate assets/ryofiles.desktop

      - name: Validate AppStream metadata
        run: appstreamcli validate --no-net assets/io.github.ashmitvoid.Ryofiles.metainfo.xml

      - name: Validate PKGBUILD shell syntax
        run: bash -n packaging/arch/PKGBUILD

      - name: Guard reversible integration
        shell: bash
        run: |
          set -euo pipefail
          if grep -En '(xdg-mime[[:space:]]+default|xdg-settings|portals\.conf|xdg-desktop-portal.*\.conf)' packaging/arch/PKGBUILD; then
            echo 'Packaging must not change file-manager or portal defaults during installation.' >&2
            exit 1
          fi

  arch-package:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install package build dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          base-devel cmake git ninja glib2 gvfs qt6-base qt6-declarative

      - name: Checkout exact workflow SHA
        uses: actions/checkout@v4

      - name: Build package as unprivileged user
        shell: bash
        run: |
          set -euo pipefail
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

          su builder -c 'git config --global protocol.file.allow always'
          su builder -c "git config --global url.\"file://$GITHUB_WORKSPACE\".insteadOf https://github.com/ashmitvoid/Ryofiles.git"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg --noconfirm --cleanbuild"

      - name: Verify package source is exact CI SHA
        shell: bash
        run: |
          set -euo pipefail
          packaged_sha="$(git -C packaging/arch/src/Ryofiles rev-parse HEAD)"
          test "$packaged_sha" = "$GITHUB_SHA" || {
            echo "PKGBUILD built $packaged_sha instead of workflow SHA $GITHUB_SHA" >&2
            exit 1
          }

      - name: Inspect package payload
        shell: bash
        run: |
          set -euo pipefail
          package_path="$(find packaging/arch -maxdepth 1 -type f -name 'ryofiles-git-*.pkg.tar.zst' -print -quit)"
          test -n "$package_path"
          bsdtar -tf "$package_path" > /tmp/ryofiles-package-files.txt

          for required in \
            usr/bin/ryofiles \
            usr/share/applications/ryofiles.desktop \
            usr/share/metainfo/io.github.ashmitvoid.Ryofiles.metainfo.xml \
            usr/share/licenses/ryofiles-git/LICENSE \
            usr/share/licenses/ryofiles-git/THIRD_PARTY_NOTICES.md; do
            grep -Fxq "$required" /tmp/ryofiles-package-files.txt || {
              echo "Missing package payload: $required" >&2
              exit 1
            }
          done

          if grep -Eq '^(etc/|usr/share/xdg-desktop-portal/)' /tmp/ryofiles-package-files.txt; then
            echo 'Package must not write system configuration or install portal takeover files.' >&2
            cat /tmp/ryofiles-package-files.txt >&2
            exit 1
          fi

      - name: Install package and verify runtime linkage
        shell: bash
        run: |
          set -euo pipefail
          package_path="$(find packaging/arch -maxdepth 1 -type f -name 'ryofiles-git-*.pkg.tar.zst' -print -quit)"
          pacman -U --noconfirm "$package_path"

          test -x /usr/bin/ryofiles
          test -f /usr/share/applications/ryofiles.desktop
          test -f /usr/share/metainfo/io.github.ashmitvoid.Ryofiles.metainfo.xml
          test -f /usr/share/licenses/ryofiles-git/LICENSE
          test -f /usr/share/licenses/ryofiles-git/THIRD_PARTY_NOTICES.md

          ldd /usr/bin/ryofiles | tee /tmp/ryofiles-ldd.txt
          if grep -Fq 'not found' /tmp/ryofiles-ldd.txt; then
            echo 'Installed package has unresolved runtime libraries.' >&2
            exit 1
          fi
